name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[keys,ghidra]"
          pip install pyinstaller

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build standalone app
        run: ./scripts/build.ps1

      - name: Package
        run: Compress-Archive -Path dist\DualForge -DestinationPath "DualForge-win64.zip" -Force

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create "$tag" "DualForge-win64.zip" --title "DualForge $tag" --generate-notes