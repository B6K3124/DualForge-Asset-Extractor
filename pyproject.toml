[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dualforge"
version = "1.0.1"
description = "Multi-engine game asset extraction toolkit (PySide6)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DualForge" }]
keywords = ["unreal", "unity", "pak", "utoc", "ucas", "asset", "extractor", "oodle", "zstd"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "PySide6>=6.6",
    "UnityPy>=1.25",
    "numpy>=1.26",
    "Pillow>=10",
    "lz4>=4.3",
    "zstandard>=0.22",
    "brotli>=1.1",
    "py7zr>=0.20",
    "requests>=2.31",
    "cryptography>=42",
]

[project.optional-dependencies]
keys = ["requests>=2.31"]
snappy = ["python-snappy>=0.6"]
dev = ["pytest>=8"]
ghidra = ["ghidra-bridge>=1.0"]

[project.scripts]
dualforge = "dualforge.cli:main"

[tool.setuptools.packages.find]
include = ["dualforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Rule set is pinned explicitly so `ruff check` is stable across ruff releases.
# The codebase is maintained against UP/B/SIM: typing modernisation, bugbear
# correctness, and readability simplifications. Intentional deviations are
# annotated with inline `# noqa` + a reason comment.
select = ["E4", "E7", "E9", "F", "B", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# Vendored third-party code (MIT, see dualforge/vendor/NOTICE.md) is kept as
# close to upstream as possible so it can be re-synced against pyuepak. Linting
# it would mean reformatting upstream code and defeating that. Our own patches
# in these files are still covered by the test suite.
"dualforge/vendor/pyuepak/*" = ["E4", "E7", "E9", "F", "B", "SIM", "UP"]
# Reverse-engineering scratch scripts (dense one-liner style) are research
# artifacts, not shipped code. The shipped behaviour they fed into lives in
# dualforge/encryption/ and is covered by the encryption test suite.
"scripts/research/*" = ["E4", "E7", "E9", "F", "B", "SIM", "UP"]
